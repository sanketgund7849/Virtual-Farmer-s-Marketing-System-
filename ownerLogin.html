<!DOCTYPE html>
<html>
<head>
<title>Owner Login</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
}

.login-box{
background:white;
width:300px;
margin:120px auto;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
padding:10px 20px;
background:green;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:darkgreen;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Owner Login</h2>

<form action="OwnerLoginServlet" method="post">

<input type="text" name="name" placeholder="Enter Name" required>

<input type="password" name="password" placeholder="Enter Password" required>

<br><br>

<button type="submit">Login</button>

</form>

</div>

</body>
</html>
