<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Farmer Login</title>

<style>

body{
    font-family: Arial;
    margin:0;
    padding:0;

    /* Farmer Agriculture Background */
    background-image:url("https://images.unsplash.com/photo-1464226184884-fa280b87c399");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* dark overlay */
.overlay{
    background:rgba(0,0,0,0.6);
    height:100vh;
    padding-top:80px;
}

.container{
    width:360px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    padding:30px;
    border-radius:10px;
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
}

h2{
    text-align:center;
    color:#2e7d32;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

input:focus{
    outline:none;
    border:1px solid #2e7d32;
}

button{
    width:100%;
    padding:12px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1b5e20;
}

a{
    text-decoration:none;
    color:#2e7d32;
    font-weight:bold;
}

p{
    text-align:center;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="overlay">

<div class="container">

<h2>Farmer Login</h2>

<form action="FarmerLoginServlet" method="post">

<input type="email" name="email" placeholder="Enter Email" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<p>
Don't have account? 
<a href="farmerdashboard.html">Register Here</a>
</p>

</div>

</div>

</body>
</html>
