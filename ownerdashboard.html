<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Owner Dashboard</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f4f6f9;
}

header{
background:#2e7d32;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
padding:40px;
}

.card{
background:white;
padding:25px;
text-align:center;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card a{
text-decoration:none;
font-size:18px;
color:#2e7d32;
font-weight:bold;
}

.logout{
position:absolute;
right:20px;
top:15px;
background:#c62828;
color:white;
padding:8px 15px;
text-decoration:none;
border-radius:5px;
}

</style>
</head>

<body>

<header>
Owner Dashboard
<a href="ownerLogin.html" class="logout">Logout</a>
</header>

<div class="container">

<div class="card">
<a href="viewFarmers.jsp">View Farmers</a>
</div>

<div class="card">
<a href="viewCustomers.jsp">View Customers</a>
</div>

<div class="card">
<a href="viewproducts.jsp">View Products</a>
</div>

<div class="card">
<a href="vieworders.jsp">View Orders</a>
</div>

<div class="card">
<a href="manageCategories.jsp">Manage Categories</a>
</div>

<div class="card">
<a href="paymentReport.jsp">Payment Reports</a>
</div>

<div class="card">
<a href="viewFeedback.jsp">View Feedback</a>
</div>

<div class="card">
<a href="addproduct.html">Add Product</a>
</div>

<div class="card">
<a href="salesReports.jsp">Sales Reports</a>
</div>

</div>

</body>
</html>
